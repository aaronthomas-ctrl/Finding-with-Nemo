name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Types, plus the guard that fails the build if industry- or country-specific words creep into src/ or server/
      - run: npm run lint
      # Prompt-injection screening patterns: every attack sample flagged, no false positives on ordinary text
      - run: npm run test:patterns
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
