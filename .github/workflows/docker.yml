name: Docker image

# Builds the production image on GitHub (no Docker needed on your own machine), proves it starts, and publishes it to
# the GitHub Container Registry so a Nebius endpoint can pull it:  ghcr.io/<owner>/<repo>:latest
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (the registry needs lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # Build args are public values that end up in the browser bundle. Set them under
      # Settings > Secrets and variables > Actions > Variables (not Secrets).
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            GOOGLE_MAPS_PLATFORM_KEY=${{ vars.GOOGLE_MAPS_PLATFORM_KEY }}

      - name: Smoke test (container starts, health answers, API refuses anonymous calls)
        run: |
          docker run -d --name nemo -p 3000:3000 -e SUPABASE_URL=https://example.supabase.co -e VITE_SUPABASE_ANON_KEY=ci ${{ env.IMAGE }}:test
          for i in $(seq 1 20); do curl -fs localhost:3000/api/health && break; sleep 1; done
          curl -fs localhost:3000/api/health | grep '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/api/pii/open)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/)" = "200"
          docker logs nemo | tail -5
          docker rm -f nemo

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            GOOGLE_MAPS_PLATFORM_KEY=${{ vars.GOOGLE_MAPS_PLATFORM_KEY }}
